plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // JEI (Just Enough Items): integração opcional
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Trechos do AutoTest da regressão paralela (tarefa regression). -PshSuites=ship,multiblock troca a lista; nome que o
// AutoTest não conhece rodaria o roteiro inteiro (~26 min), então ele é recusado aqui.
def regressionSuites = (findProperty('shSuites') ?: 'ship,shipflight,shipconvert,shipground,shipascent,shipdescent,shipdeckreal,shipdeckuse,shipseam,multiblock,blueprint,tier2,mars,shipanchor,shipanchor2,shipsee,moonbase,story,marsorbit').toString()
        .split(',')*.trim().findAll { it }
def autoTestSource = file('src/main/java/com/spacehorizons/client/devtest/AutoTest.java').getText('UTF-8')
regressionSuites.each { String suite ->
    if (!autoTestSource.contains("\"${suite}\".equals(ONLY)")) {
        throw new GradleException("Trecho de autoteste desconhecido em -PshSuites: '${suite}' (veja os \"nome\".equals(ONLY) do AutoTest)")
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Cliente de autoteste: cria um mundo novo, roda o roteiro de AutoTest e fecha.
        // Roda em run-test/, separado do run/ do jogo normal: o autoteste nunca encosta nos mundos de quem joga.
        clientTest {
            client()
            gameDirectory = project.file('run-test')
            // cria do zero o mundo run-test/saves/SpaceAuto com o tipo "Space Horizons" (prepareClientTest apaga antes)
            systemProperty 'spacehorizons.autotest', 'true'
            systemProperty 'spacehorizons.autotest.fresh', 'SpaceAuto'
            // -PshOnly=clouds roda só um trecho do roteiro (ver AutoTest)
            if (project.hasProperty('shOnly')) {
                systemProperty 'spacehorizons.autotest.only', project.property('shOnly').toString()
            }
        }

        // Regressão paralela: uma run por trecho do roteiro, cada uma na sua pasta run-test/<trecho>/ e com os seus
        // arquivos de argumentos (ver a tarefa regression mais abaixo)
        regressionSuites.each { String suite ->
            create("clientTest${suite.capitalize()}") {
                client()
                gameDirectory = project.file("run-test/${suite}")
                jvmArguments.add('-Xmx5G')
                systemProperty 'spacehorizons.autotest', 'true'
                systemProperty 'spacehorizons.autotest.fresh', 'SpaceAuto'
                systemProperty 'spacehorizons.autotest.only', suite
            }
        }

        // Autoteste de DOIS clientes do convés (fase 2e): A cria o mundo, abre a LAN e roda o roteiro; B entra pela LAN e observa. Sobem juntos pela
        // tarefa shipdeck2 (mais abaixo); cada um tem a sua pasta run-test/shipdeck2 e run-test/shipdeck2b e conversam por run-test/shipdeck2-shared.
        clientTestShipdeck2 {
            client()
            gameDirectory = project.file('run-test/shipdeck2')
            jvmArguments.add('-Xmx4G')
            programArguments.addAll('--username', 'ObsA')
            systemProperty 'spacehorizons.autotest', 'true'
            systemProperty 'spacehorizons.autotest.fresh', 'SpaceAuto'
            systemProperty 'spacehorizons.autotest.only', 'shipdeck2'
        }
        clientTestShipdeck2b {
            client()
            gameDirectory = project.file('run-test/shipdeck2b')
            jvmArguments.add('-Xmx3G')
            programArguments.addAll('--username', 'ObsB')
            systemProperty 'spacehorizons.autotest', 'true'
            systemProperty 'spacehorizons.autotest.only', 'shipdeck2b'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Antes do autoteste: recusa se algum mundo da pasta do autoteste está aberto (outro autoteste rodando), avisa se o
// jogo normal está aberto em run/, apaga o SpaceAuto e os prints autotest_* da pasta e, na primeira vez, copia a
// config dos mods de run/ (DH, Sodium, JEI) para o autoteste rodar com as mesmas opções.
def registerPrepareClientTest(String name, File runDir, File testDir) {
    String testName = testDir.name
    return tasks.register(name) {
        doLast {
            // o Minecraft segura um FileLock em saves/<mundo>/session.lock enquanto o mundo está aberto
            def openWorlds = { File dir ->
                def saves = new File(dir, 'saves')
                (saves.listFiles() ?: []).findAll { File world ->
                    def lock = new File(world, 'session.lock')
                    if (!lock.isFile()) return false
                    try (def channel = java.nio.channels.FileChannel.open(lock.toPath(), java.nio.file.StandardOpenOption.WRITE)) {
                        def l = channel.tryLock()
                        if (l == null) return true
                        l.release()
                        return false
                    } catch (java.nio.channels.OverlappingFileLockException | IOException ignored) {
                        return true
                    }
                }*.name
            }
            def busy = openWorlds(testDir)
            if (busy) {
                throw new GradleException("Mundo aberto em ${testName}/saves (${busy.join(', ')}): outro autoteste está rodando. Feche-o antes.")
            }
            def playing = openWorlds(runDir)
            if (playing) {
                logger.warn("Aviso: o jogo normal está aberto em run/ (${playing.join(', ')}). O autoteste roda em ${testName}/ e não mexe nele.")
            }
            // sem isto a pasta nova abre na tela de acessibilidade da primeira execução, na frente do menu inicial
            def options = new File(testDir, 'options.txt')
            testDir.mkdirs()
            def optionLines = options.isFile() ? options.readLines('UTF-8').findAll { !it.startsWith('onboardAccessibility:') } : []
            options.withWriter('UTF-8') { w -> (optionLines + ['onboardAccessibility:false']).each { w.writeLine(it) } }
            new File(testDir, 'saves/SpaceAuto').deleteDir()
            (new File(testDir, 'screenshots').listFiles() ?: []).findAll { it.isFile() && it.name.startsWith('autotest_') }*.delete()
            def testConfig = new File(testDir, 'config')
            def runConfig = new File(runDir, 'config')
            if (!testConfig.exists() && runConfig.isDirectory()) {
                testConfig.mkdirs()
                runConfig.eachFileRecurse { File src ->
                    def dst = new File(testConfig, runConfig.toPath().relativize(src.toPath()).toString())
                    if (src.isDirectory()) dst.mkdirs() else java.nio.file.Files.copy(src.toPath(), dst.toPath())
                }
            }
        }
    }
}

def prepareClientTest = registerPrepareClientTest('prepareClientTest', file('run'), file('run-test'))
tasks.matching { it.name == 'runClientTest' }.configureEach { dependsOn prepareClientTest }

// Regressão paralela: ./gradlew regression roda os trechos de regressionSuites ao mesmo tempo, cada um no seu
// cliente e na sua pasta run-test/<trecho>/, no máximo -PshParallel clientes juntos (padrão 3), e no fim imprime
// quantas verificações passaram e falharam em cada um. A tarefa falha se algum trecho falhar ou não registrar
// nenhuma verificação (cliente que caiu, trecho que não existe).
abstract class AutotestClientSlots implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def clientSlots = gradle.sharedServices.registerIfAbsent('spacehorizonsAutotestClients', AutotestClientSlots) {
    maxParallelUsages = (findProperty('shParallel') ?: '3').toString().toInteger()
}
regressionSuites.each { String suite ->
    def prepare = registerPrepareClientTest("prepareClientTest${suite.capitalize()}", file('run'), file("run-test/${suite}"))
    tasks.matching { it.name == "runClientTest${suite.capitalize()}" }.configureEach {
        dependsOn prepare
        usesService(clientSlots)
        // um cliente que cai não para os outros: o relatório da regressão acusa o trecho sem verificações
        ignoreExitValue = true
    }
}
tasks.register('regression') {
    group = 'verification'
    description = 'Roda os autotestes de regressão em paralelo e resume as verificações de cada um.'
    dependsOn regressionSuites.collect { "runClientTest${it.capitalize()}" }
    def logs = regressionSuites.collectEntries { [(it): file("run-test/${it}/logs/latest.log")] }
    doLast {
        def bad = []
        def lines = ['', 'Regressão dos autotestes:', String.format('  %-14s %8s %8s', 'trecho', 'passou', 'falhou')]
        logs.each { String suite, File log ->
            int passed = 0
            int checks = 0
            if (log.isFile()) {
                // os cenários escrevem "[AUTOTEST] CHECK <resultado> ..." ou com prefixo ("SHIPCHECK", "SHIPGROUND CHECK");
                // a linha RESUMO não é verificação
                def checkLine = ~/\[AUTOTEST\].*?[A-Z]*CHECK (\S+)/
                log.eachLine('UTF-8') { String line ->
                    def m = checkLine.matcher(line)
                    if (m.find() && m.group(1) != 'RESUMO' && m.group(1) != 'RESUMO:') {
                        checks++
                        if (m.group(1) == 'PASSOU') passed++
                    }
                }
            }
            int failed = checks - passed
            String note = checks == 0 ? '  <- nenhuma verificação (o cliente caiu ou o trecho não existe)' : (failed > 0 ? '  <- FALHOU' : '')
            if (checks == 0 || failed > 0) bad << suite
            lines << String.format('  %-14s %8d %8d', suite, passed, failed) + note
        }
        lines << ''
        logger.lifecycle(lines.join(System.lineSeparator()))
        if (bad) {
            throw new GradleException("Regressão com problema em: ${bad.join(', ')} (logs em run-test/<trecho>/logs/latest.log)")
        }
    }
}

// Autoteste de dois clientes (fase 2e, outros clientes veem o tripulante no convés): ./gradlew shipdeck2 --console=plain
// Sobe o cliente A (anfitrião, run-test/shipdeck2) e o cliente B (observador, run-test/shipdeck2b) ao mesmo tempo; B espera A abrir o mundo na
// porta 25599 (-Dspacehorizons.autotest.port) e entra. Não faz parte da regressão padrão (é um par de clientes, ~12 min). No fim resume as
// verificações dos dois logs; falha se alguma falhou ou se algum dos dois não registrou nenhuma.
def shipdeck2SharedDir = file('run-test/shipdeck2-shared')
def prepareShipdeck2Shared = tasks.register('prepareShipdeck2Shared') {
    doLast { shipdeck2SharedDir.deleteDir() }
}
def prepareShipdeck2A = registerPrepareClientTest('prepareClientTestShipdeck2', file('run'), file('run-test/shipdeck2'))
def prepareShipdeck2B = registerPrepareClientTest('prepareClientTestShipdeck2b', file('run'), file('run-test/shipdeck2b'))
['clientTestShipdeck2': prepareShipdeck2A, 'clientTestShipdeck2b': prepareShipdeck2B].each { String run, prepare ->
    tasks.matching { it.name == "run${run.capitalize()}" }.configureEach {
        dependsOn prepare
        dependsOn prepareShipdeck2Shared
        usesService(clientSlots)
        ignoreExitValue = true
    }
}
tasks.register('shipdeck2') {
    group = 'verification'
    description = 'Autoteste de dois clientes do convés andável: A anda no convés, B observa e mede onde desenha A.'
    dependsOn 'runClientTestShipdeck2', 'runClientTestShipdeck2b'
    def logs = ['A (anfitrião)': file('run-test/shipdeck2/logs/latest.log'), 'B (observador)': file('run-test/shipdeck2b/logs/latest.log')]
    doLast {
        def bad = []
        def lines = ['', 'Autoteste de dois clientes (shipdeck2):', String.format('  %-16s %8s %8s', 'cliente', 'passou', 'falhou')]
        logs.each { String who, File log ->
            int passed = 0
            int checks = 0
            if (log.isFile()) {
                def checkLine = ~/\[AUTOTEST\].*?[A-Z0-9]*CHECK (\S+)/
                log.eachLine('UTF-8') { String line ->
                    def m = checkLine.matcher(line)
                    if (m.find() && m.group(1) != 'RESUMO' && m.group(1) != 'RESUMO:') {
                        checks++
                        if (m.group(1) == 'PASSOU') passed++
                    }
                }
            }
            int failed = checks - passed
            if (checks == 0 || failed > 0) bad << who
            lines << String.format('  %-16s %8d %8d', who, passed, failed) + (checks == 0 ? '  <- nenhuma verificação (o cliente caiu)' : (failed > 0 ? '  <- FALHOU' : ''))
        }
        lines << ''
        logger.lifecycle(lines.join(System.lineSeparator()))
        if (bad) {
            throw new GradleException("shipdeck2 com problema em: ${bad.join(', ')} (logs em run-test/shipdeck2/logs/latest.log e run-test/shipdeck2b/logs/latest.log)")
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Distant Horizons: só a API em compile time, para não usar classes internas por engano
    compileOnly "maven.modrinth:distanthorizonsapi:${dh_api_version}"
    // Mods de runtime de dev alternáveis por propriedade Gradle (padrão: só o DH):
    //   -PshDh=false      tira o Distant Horizons do runtime
    //   -PshSodium=true   adiciona o Sodium
    //   -PshIris=true     adiciona o Iris (e o Sodium, que ele exige)
    // Ex.: ./gradlew runClient -PshDh=false -PshSodium=true
    boolean shDh = (findProperty('shDh') ?: 'true').toString().toBoolean()
    boolean shIris = (findProperty('shIris') ?: 'false').toString().toBoolean()
    boolean shSodium = shIris || (findProperty('shSodium') ?: 'false').toString().toBoolean()
    if (shDh) {
        localRuntime "maven.modrinth:distanthorizons:${dh_version}"
    }

    // Sodium e Iris entram só em runtime de dev: os mixins de compat miram o Sodium por nome de classe
    // (o jar do Sodium é um wrapper jar-in-jar, as classes reais não estão no classpath de compilação).
    if (shSodium) {
        localRuntime "maven.modrinth:sodium:${sodium_version}"
    }
    if (shIris) {
        localRuntime "maven.modrinth:iris:${iris_version}"
    }

    // JEI: só a API em compile time (integração opcional); o mod completo no runtime de dev (-PshJei=false tira)
    // A versão fica aqui e não no gradle.properties, que o .gitignore global do usuário ignora.
    def jeiVersion = '31.13.0.68'
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jeiVersion}"
    if ((findProperty('shJei') ?: 'true').toString().toBoolean()) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jeiVersion}"
    }

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Testes do planeta usam PlanetDefinition, que depende de Identifier do Minecraft: o teste precisa do classpath do mod.
dependencies {
    testImplementation files(sourceSets.main.compileClasspath)
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
